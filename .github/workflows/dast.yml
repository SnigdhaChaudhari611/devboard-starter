# Goal: Scan the app DAST

name: OWASP ZAP DAST Scan

on: 
    workflow_call:

jobs:
    dast:
        runs-on: self-hosted
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7   
            
            - name: Wait for the services to be healthy
              run: |
                timeout 60 bash -c 'until curl -s http://${{ secrets.EC2_HOST }}:8080 do sleep 2; done'

            - name: Run OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@v0.14.0
              with:
                target: "http://${{ secrets.EC2_HOST }}:8080"
                token: ${{ secrets.GITHUB_TOKEN }}
                fail_action: false
                allow_issue_writing: false
