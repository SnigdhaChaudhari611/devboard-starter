# Goal: Implement shift left, i.e., DevSecOps end-to-end for this project.

name: DevSecOps

on: 
  push:

jobs:

  # Secrets Scan
  secret_scan:
      uses: ./.github/workflows/secret_scanning.yml
      secrets: inherit
  # Code
  code:
      needs: secret_scan
      uses: ./.github/workflows/lint.yml

  # SAST Scan
  sast:
    needs: code
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit

  # Dependency Scan
  dependency_scan:
    needs: sast
    uses: ./.github/workflows/dependency_scan.yml
    
  # Build and Scan
  build-and-scan:
    secrets: inherit
    needs: dependency_scan
    uses: ./.github/workflows/trivy_scans.yml


