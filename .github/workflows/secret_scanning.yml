# Goal: to scan the code for tokens, secrets, API keys, or any leaked passwords

name: Secrets Scan

on:
  workflow_call: 

jobs:
  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  #get all code from beginning commits
          
      - name: Scan for leaks
        uses: dortort/betterleaks-action@v0.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        continue-on-error: true
