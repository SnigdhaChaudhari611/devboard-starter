# Serves the built React app and forwards /api to the Go backend
# (replaces what vite.preview.config.js did with `vite preview`).
server {
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version
    server_tokens off;

    # /api/... -> http://backend:8080/...  (strips the /api prefix)
    location /api/ {
        # Docker's internal DNS, so nginx starts even if backend isn't up yet
        resolver 127.0.0.11 valid=10s;
        set $upstream backend:8080;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: send unknown paths back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}